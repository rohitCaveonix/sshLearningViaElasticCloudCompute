name: Build and Deploy to AWS EC2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'corretto'
        cache: maven

    - name: Build with Maven
      run: mvn -B package -DskipTests --file pom.xml

    - name: Copy JAR to AWS EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "target/sshLearningViaElasticCloudCompute-0.0.1-SNAPSHOT.jar"
        target: "/home/ec2-user/deploy"
        strip_components: 1

    - name: Deploy and Restart Service on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo mv /home/ec2-user/deploy/sshLearningViaElasticCloudCompute-0.0.1-SNAPSHOT.jar /opt/sshlearning/app.jar
          sudo chown ec2-user:ec2-user /opt/sshlearning/app.jar
          sudo systemctl restart sshlearning
          sudo systemctl status sshlearning --no-pager
